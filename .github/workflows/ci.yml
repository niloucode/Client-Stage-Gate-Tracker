name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # t3-env validates server vars at import time (Task 1.8), so the
          # build needs the full set — NEXT_PUBLIC_* are inlined into the
          # client bundle, DATABASE_URL/SUPABASE_SERVICE_ROLE_KEY are
          # validated server-side.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SKIP_ENV_VALIDATION: ${{ secrets.SKIP_ENV_VALIDATION }}

      # Lint is not a hard gate yet: the repo carries ~800 pre-existing
      # legacy-code lint errors. Run it visibly so the count stays on the
      # radar while the debt is paid down (see Planned-Fixes.md Phase 6).
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      # Dead-code gate (2026-08-15): knip is clean under knip.json —
      # vendored surfaces (reui gantt, shadcn kit) and config-referenced
      # stubs are ignored; type-only reports stay informational.
      - name: Dead-code check
        run: npx knip --include files,dependencies,exports
